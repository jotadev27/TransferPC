[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "TransferPC"
version = "1.0"
description = "Verified local file transfers for Linux"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.scripts]
transferpc = "transferpc.__main__:main"

[tool.setuptools.packages.find]
include = ["transferpc*"]
